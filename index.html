<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var isWsError = function (msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('failed to connect') !== -1 ||
            str.indexOf('đóng mà không mở') !== -1 ||
            str.indexOf('không thể kết nối') !== -1 ||
            str.indexOf('ket noi voi websocket') !== -1 ||
            str.indexOf('dong ma khong mo') !== -1 ||
            (str.indexOf('connect') !== -1 && str.indexOf('vite') !== -1)
          );
        };

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = (reason && (reason.message || reason)) || '';
            if (isWsError(msg)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            var msg = event.message || (event.error && event.error.message) || '';
            if (isWsError(msg)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        var origError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var joined = args
            .map(function (a) {
              return (a && (a.message || a)) || '';
            })
            .join(' ');
          if (isWsError(joined)) {
            return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var joined = args
            .map(function (a) {
              return (a && (a.message || a)) || '';
            })
            .join(' ');
          if (isWsError(joined)) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function () {
          var args = Array.prototype.slice.call(arguments);
          var joined = args
            .map(function (a) {
              return (a && (a.message || a)) || '';
            })
            .join(' ');
          if (isWsError(joined)) {
            return;
          }
          origLog.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function () {
          var args = Array.prototype.slice.call(arguments);
          var joined = args
            .map(function (a) {
              return (a && (a.message || a)) || '';
            })
            .join(' ');
          if (isWsError(joined)) {
            return;
          }
          origInfo.apply(console, arguments);
        };
      })();
    </script>
