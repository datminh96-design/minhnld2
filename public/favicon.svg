<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background circle with emerald gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#coinGrad)" filter="url(#shadow)" />
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6" />
  <!-- Golden center medallion -->
  <circle cx="32" cy="32" r="20" fill="url(#goldGrad)" stroke="#FEF3C7" stroke-width="1.5" />
  <!-- Currency / Money Symbol (USD / VND / Coin symbol) -->
  <path d="M32 18v28M36.5 24.5c0-2.5-2-4-4.5-4s-4.5 1.5-4.5 3.8c0 3.5 9 3 9 7.2 0 2.8-2.2 4.5-4.5 4.5s-5-1.8-5-4.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
